<div class="min-h-screen flex align-items-center justify-content-center p-3 surface-ground">
  <p-card styleClass="w-full sm:w-30rem shadow-4 border-round-xl">
    
    <div class="text-center pt-5 px-4 mb-4">
      <i class="pi pi-lock text-primary text-5xl mb-3"></i>
      <h2 class="m-0 text-900">¡Hola de nuevo!</h2>
      <p class="mt-2 mb-0 text-600">Ingresa tus datos para acceder a tu cuenta.</p>
    </div>

    <form [formGroup]="form" class="flex flex-column gap-4">
      
      <div class="flex flex-column gap-2">
        <label for="email" class="font-semibold text-700">Correo electrónico</label>
        <span class="p-input-icon-left w-full">
          <i class="pi pi-envelope text-500"></i>
          <input
            id="email"
            type="email"
            pInputText
            placeholder="ejemplo@correo.com"
            class="w-full p-inputtext-lg"
            formControlName="email"
          />
        </span>
      </div>

      <div class="flex flex-column gap-2">
        <label for="password" class="font-semibold text-700">Contraseña</label>
        <p-password
  inputId="password"
  [toggleMask]="true"
  [feedback]="false"
  placeholder="Tu contraseña secreta"
  formControlName="password"
  [styleClass]="'w-full'" 
  [inputStyleClass]="'w-full p-inputtext-lg'"
></p-password>
      </div>

      <div *ngIf="error" class="p-3 bg-red-50 border-round-lg flex align-items-center gap-3 text-red-600 border-1 border-red-100">
        <i class="pi pi-times-circle text-xl"></i>
        <span class="text-sm font-medium">{{ error }}</span>
      </div>

      <div class="mt-2 flex flex-column gap-3">
        <p-button
          label="Ingresar"
          icon="pi pi-sign-in"
          styleClass="w-full p-button-lg shadow-2 border-round-lg"
          (onClick)="login()"
          [disabled]="form.invalid">
        </p-button>

        <hr class="border-top-1 surface-border w-full my-2" />

        <div class="text-center">
          <span class="text-600 mr-2 font-medium">¿Aún no tienes cuenta?</span>
          <p-button
            label="Regístrate aquí"
            styleClass="p-button-link p-0 font-bold"
            [routerLink]="['/auth/register']">
          </p-button>
        </div>
      </div>
    </form>
  </p-card>
</div>
